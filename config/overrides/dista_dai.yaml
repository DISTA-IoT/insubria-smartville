intrusion_detection:
  wb_tracking: true
  wb_run_name: 'DAI_noTmodel'
  agent: DAI
  h_dim: 200
  inference_freq_secs: 0.1
  flowstats_freq_secs: 0.5


topology_creator:
  use_gns3_config_file: false
  env_vars: |
    https_proxy=http://proxy.uninsubria.it:3128
    HTTPS_PROXY=http://proxy.uninsubria.it:3128
    HTTP_PROXY=http://proxy.uninsubria.it:3128
    http_proxy=http://proxy.uninsubria.it:3128
    no_proxy=localhost,127.0.0.1,192.168.122.1
    
base_params: 
  # container_manager_replay_from_file : false
  disable_proxy: true
  replay_speed: 10 # Replay speed factor
