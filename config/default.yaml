override: ""
# SmartVille Configuration

host_ip: localhost
gns3_web_gui_port: 3080
disable_proxy: false  # Whether to disable the proxy for the nodes of the topology
dashboard_port: 7777 # Port of the Flask dashboard in the host machine
pending_packet_feats_poll_secs: 2 # How often (seconds) the dashboard's PACKET QUEUES tab polls the controller for pending_packet_feats queue utilisation
browser_path: firefox
inference_model_variant: mahalanobis # Picks im_models/<name>.py inside smartville-controller (default, mahalanobis, optim, dotprod_kr, dotprod_kr_simple_krloss, simple_krloss)

smart_controller_log_level: info
smart_switch_log_level: info
flow_logger_log_level: info

health_monitoring: true
use_packet_feats: true
node_features: true  # Use health monitoring features to build the feature vectors (requires health monitoring = true)
resample_packets : true # wheter to periocially sample new packets from flows, if false, the first packets of the flow are used continuously

device: cpu # Can be 'cpu' or 'cuda:0', 'cuda:1', etc. Depending on hw availability

synthetic_data: false # for ablation, overwrites real data with gaussian blobs
separability: 1.0 # if using synthetic data, this indicates separability among clusters (1 -> perfectly separable, 0 -> non-separable)

topology_creator:
  # Topology creation configuration
  project: SmartVille

  # Docker images
  controller_docker: pox-controller
  switch_docker: openvswitch
  victim_docker: victim
  attacker_docker: attacker
  monitor_docker: monitor
  mockserver_docker: mockserver
  # STANDALONE IMAGES (OPTIONAL, NOT USED RIGHT NOW)
  zookeeper_docker: confluentinc/cp-zookeeper
  kafka_docker: confluentinc/cp-kafka
  prometheus_docker: prom/prometheus
  grafana_docker: grafana/grafana

  # important ips.
  # PRIVATE SUBNET (INTERNAL NETWORK FOR GNS3 EMULATION)
  subnet: 192.168.1.0
  netmask: /24
  controller_ip: 192.168.1.1 # internal controller port (eth0)
  main_switch_ip: 192.168.1.2
  mockserver_ip: 192.168.1.3
  bridge_ip: 192.168.1.100

  # PUBLIC SUBNET (HOST NETWORK, FOR SMARTVILLE WEBSERVICES)
  controller_hostname: controller # this will be the hostname of the EXTERNAL controller port (eth1)
  monitor_hostname: monitor # this guy will be dynamically assigned an ip on the host network (not the subnet)
  
  ############# ENV VARS:
  monitor:
    SERVER_PORT: 5000

  controller:
    SERVER_PORT: 7777
    ECHO_PORT: 7778
    INTERNAL_IP: ${topology_creator.controller_ip}
  attacker:
    SERVER_PORT: 7777
  
  victim:
    SERVER_PORT: 7777

  mockserver:
    SERVER_PORT: 7777
  ############# EO ENV VARS


  
  # Controller configuration
  contr_start: "../../pox.py samples.pretty_log smartController.tiger_server" # could also be "sh"
  monitor_start: "python monitor_server.py"
  victim_start: "python honeypot_server.py"
  attacker_start: "python attacker_server.py"
  mockserver_start: "python app.py"
  attach_controller_command: "ovs-vsctl set-controller br0 tcp:${topology_creator.controller_ip}:6633 & sh"
  # GNS3 Configuration
  use_gns3_config_file: true
  gns3_config_path: ~/.config/GNS3/2.2/gns3_server.conf

  # GNS3 Server settings (used when use_gns3_config_file is false)
  gns3_host: localhost
  gns3_port: 3080
  gns3_auth: false
  gns3_username: admin
  gns3_password: admin

    
  # Additional Environment variables for all nodes (VAR=VALUE newline separated)
  ADDITIONAL_ENV_VARS: |
    FOO=bar
    BAR=foo


  ###################################################################################################################
  ####### STANDALONE MONITORING NODES
  # these configuration variables are applied only when 
  # the monitoring nodes are standalone ones:

  # These are used only if the monitorning nodes are standalone ones:
  zookeeper_ip: ${topology_creator.monitor_hostname}
  kafka_ip: ${topology_creator.monitor_hostname}
  grafana_ip: ${topology_creator.monitor_hostname}
  prometheus_ip: ${topology_creator.monitor_hostname}

  grafana_start: "run.sh"
  zookeeper_start: "/etc/confluent/docker/run"
  kafka_start: "/etc/confluent/docker/run"
  prometheus_start: "/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.console.libraries=/usr/share/prometheus/console_libraries --web.console.templates=/usr/share/prometheus/consoles"

  zookeeper:
    ZOOKEEPER_SERVER_ID: 1
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000

  kafka:
    KAFKA_BROKER_ID: 1  # Unique identifier for this Kafka broker
    KAFKA_ZOOKEEPER_CONNECT: ${topology_creator.zookeeper_ip}:2181  # Address to connect to Zookeeper
    KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:19092  # Listeners for internal and external communication
    KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092  # Ports to bind Kafka to for listening
    KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE  # Listener for internal Kafka broker communication
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT  # Security protocol mappings for each listener
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # Replication factor for internal Kafka topics
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'  # Automatically create topics when required
    KAFKA_PROCESS_ROLES: 'broker,controller'
    CLUSTER_ID: '1'

  grafana:
   BAR: 'foo'

  prometheus:
   BAR: 'foo'
  ####### END OF STANDALONE MONITORING NODES
  ###################################################################################################################




wandb:
  wb_tracking: false #  Track this run with WeightsAndBiases. (default is False)
  wb_project_name:  'SmartVille' # if 'wb_tracking'=True, The name of the W&B project to associate the run with. Default is 'SmartVille'
  wb_run_name: 'My_new_run' # if 'wb_tracking'=True, the name of the W&B run to track training metrics.
  wb_group_name: 'default'
  entity: jfcevallos
  plots: false
  resource_monitor_interval_secs: 12 # for wholistic system resource monitoring


health:
  max_conn_retries: 5 #(int, optional): max. num. of connections attempts to the kafka broker. Default is 5.
  poll_timeout_seconds: 3 # consumer poll timeout in seconds.
  max_failed_polls: 40 # max. num. of failed poll attempts after which the consuming task is aborted for each topic
  topic_replication_factor: 1
  ping_host: 'www.google.com'
  ping_thread_timeout: 5
  probe_frequency_seconds: 3
  node_features_time_window: 10
  rtt_profiling_num_requests: 20
  rtt_profiling_interval_ms: 100
  probe_metrics:
    - CPU
    # - RAM
    - external_http_rtt
    # - icmp_min_rtt_ms
    # - icmp_max_rtt_ms
    - icmp_avg_rtt_ms
    - icmp_loss_percent
    # - http_min_rtt_ms
    # - http_max_rtt_ms
    - http_avg_rtt_ms
    - http_loss_percent
    - inbound_MBps
    - outbound_MBps
    - inbound_packets_per_second
    - outbound_packets_per_second



neural_modules:
  first_stream_input_size: ${intrusion_detection.flow_feat_dim}
  second_stream_input_size: ${intrusion_detection.packet_feat_dim}
  third_stream_input_size: ${len:${health.probe_metrics}}
  hidden_size: 200
  kernel_regressor_heads: 2
  dropout: 0.2 # Dropout rate for the neural network.
  use_encoder: true
  recurrent_layers: 2
  frozen_decoder: false
  custom_inference_model_path: false
  custom_classifier_path: emptystring
  custom_confidence_decoder_path: emptystring

switching_args:
  flow_idle_timeout:  10 # Number of no-activity seconds for a flow that triggers the switch to delete the corresponding entry in the flow table. 
  arp_timeout: 900 # Number of seconds to delete and ARP entry in the switch. 
  max_buffered_packets: 5  # Max num. of packets the switch buffers while waiting to solve the dest MAC address and forward. . 
  max_buffering_secs: 5  # Max time in seconds the switch buffers a packet while waiting to solve the dest MAC address and forward. 
  arp_req_exp_secs: 4 #  Max time in secs. that the switch waits for an ARP response before issuing another requets. (prevents ARP flooding). 
  sampling_rate_seconds: 10 # (if resample_pakets = True) Time between two consecutive sampling rule installation.
  sampling_flow_hard_timeout: 7 # (if resample_pakets = True) Sampling rules will be hard timed out after this period in seconds.

intrusion_detection:
  eval: false  # Whether to use neural modules in evaluation mode (no training)  
  learning_rate: 1e-3
  use_huber_cs: true # Use Huber loss for the classification loss.
  pretrained_models_dir: '/pox/pox/smartController/tiger_models/'  # This path refers to a path inside the controller docker container
  save_models: false # overwritte models on disk.
  data_collection_mode: false  # If true, TigerBrain records every fully-labelled batch it sees to disk (see FlowDataRecorder) for later offline replay.
  data_collection_dir: '/pox/pox/smartController/tiger_data_collection/'  # Path inside the controller docker container where recorded shards are written.
  data_collection_shard_size: 2000  # Number of samples buffered in memory before a shard is flushed to disk.
  data_collection_flush_interval_secs: 30  # Max seconds a partial shard can sit in memory before being flushed, even if shard_size hasn't been reached.
  data_collection_use_packet_feats: true  # Whether to additionally persist packet_features in each shard (raises disk usage).
  data_collection_use_node_feats: false  # Whether to additionally persist node_features in each shard.
  data_collection_skip_training: false  # If true, process_input returns right after recording -- no IM/DM compute, pure capture run.
  seed: 777  # A fixed initial seed for random sampling and storing in the experience buffer
  agent: DAI_P  # can be DQN, DDQN or DAI
  packets_per_sample: 5 # If 'use_packet_feats'=True, indicates how many packets are appended from each flow to build feature vectors
  max_packet_samples_per_flow_per_tick: 32 # Caps how many packet-feature samples a single flow can contribute to one inference/training tick; excess backlog drains over subsequent ticks instead of blowing up the batch size.
  max_pending_packet_feats: 4096 # Caps how many freshly-captured packets a single flow can queue up awaiting consumption (pending_packet_feats); once full, newly captured packets for that flow are dropped instead of growing the queue unbounded.
  cache_flows_with_no_packets: true # If a flow captured no fresh packet this tick, still emit a sample from its sticky last-known packets (true, legacy behaviour) instead of skipping the flow for the tick (false). NOTE: this knob is gonna do something only if packet feats are activated (use_packet_feats=true); with packet feats off, every flow always contributes exactly one row regardless.
  packet_feat_dim: 64
  anonymize_transport_ports: true
  flow_feat_dim: 4
  flows_per_sample: 10  # Indicates the flowstats time-window size to build feature vectors
  curriculum: 1 # labelling scheme for known attacks, train ZdAs and test ZdAs. (can be 0,1, or 2). Default is 1. 
  flowstats_freq_secs:  5 # Num. of seconds between two consecutive flowstats request from this controller to its assigned switch. MUST BE GRATER THAN 1 SEC.
  k_shot: 4 #  Number of support samples per class (k value for k_shot learning).
  batch_size: 16 # Batch size for the neural network.
  kernel_regression: True
  report_step_freq: 5 # Step Frequency of reporting the training step. 
  plot_step_freq: 150 # Step Frequency of plotting hidden states, score vectors and conf matrices.
  online_eval_step_freq: 100 # Step Frequency of online evaluation.
  use_neural_AD: True
  use_neural_KR: True
  use_neural_CS: True
  exclude_g1_from_ad_known_set: false # if True, the online anomaly detector scores each sample only against the true Known-class prototypes, dropping G1 columns from its known-set. By default (false) G1 is folded into the inference known-set (G1 carries zda_label 0 at inference), so a real zero-day (G2) sitting near a G1 prototype is scored as non-anomalous and missed; enabling this removes that specific "G2-near-G1" blind spot. Skipped automatically if excluding G1 would empty the known-set.
  ad_threshold: 0.75 # Decision threshold applied to the confidence decoder's anomaly probability to obtain the binary Known/anomaly verdict (both for the online decision path and for the AD confusion-matrix/accuracy metrics). Higher values require more confidence before flagging a sample as anomalous.
  ad_loss_backprop_to_encoder: true # if True, the online anomaly detector loss is backpropagated to the encoder.
  online_evaluation: false
  online_evaluation_rounds: 10
  pretrained_inference: True
  greedy_cti: False
  cti_period: -1
  fixed_threshold_cti: False # RC 3.6(b): buy CTI whenever cluster confidence < cti_confidence_threshold
  cti_confidence_threshold: 0.5 # threshold on the confidence_strategy signal (scale is strategy-dependent)
  confidence_strategy: 'energy' # confidence measure fed to the DM state: 'energy' | 'entropy' | 'margin' | 'baseline' (logit log-ratio)
  max_budget: 600
  min_budget: -850
  max_episode_steps: 10000
  disable_budget_bankrupt_termination: true # if True, episodes no longer end on bankruptcy (budget < min_budget); they end only on the step horizon (and, unless disabled, the win threshold). Default false keeps legacy bankrupt termination.
  disable_budget_win_termination: true # if True, episodes no longer end on hitting max_budget; they end only on the step horizon (>= max_episode_steps) or bankruptcy (< min_budget). Default true.
  multi_class: true  # A boolean flag indicating if the ML classifier should perform multi-class classification
  tiger_init_budget: 1
  cti_price_factor: 2
  price_decay: false
  replay_batch_size: 32
  replay_buffer_max_capacity: 10000 # Capacity of each per-class inference-module training buffer (RawReplayBuffer) that online inference/training sample balanced batches from. NOTE: this no longer sizes the per-flow rolling windows -- those are sized by flows_per_sample / packets_per_sample (the only rows ever read), so this knob is purely the per-class training store.
  agent_memory_size: 2000
  # K1: inference-module training cadence, decoupled from the (inference) tick.
  # online_inference runs every tick (live metrics); training runs
  # train_steps_per_tick gradient steps once every train_every_n_ticks
  # training-eligible ticks. Defaults (1, 1) == the original one-step-per-tick.
  train_steps_per_tick: 1 # How many IM gradient steps to run per training tick (>1 = more steps/tick, faster convergence but costlier tick; 0 = inference only, no IM training).
  train_every_n_ticks: 1 # Run the IM training block only every n-th training-eligible tick (>1 = fewer gradient steps overall, cheaper ticks).
  repulsive_weight: 1
  attractive_weight: 1
  clustering_loss_backprop: True
  init_epsilon_egreedy: 1.0
  greedy_min: 0.01
  greedy_decay: 0.999
  agent_discount_rate: 0.99
  agency: true # activates the management agent, false to only pretrain the inference modules.
  relational_state: false # if True, the DM's exteroceptive state is a fixed-size relational summary of the group's/cluster's similarity to the known-class prototypes (nearest/farthest/mean closeness, spread, top-2 margin, entropy, energy), instead of the absolute hidden-space centroid. Keeps the decision layer consistent with the prototypical/relational-bottleneck inductive bias of the perception layers, is invariant to the number of known classes, and is more stable than absolute coordinates under representation drift. Default false (legacy raw-centroid state). Changes the RL state dimension, so pretrained DM weights are not compatible across this flag.
  automatic_cs_acceptance: false # if True, the management module automatically accepts the closed-set inferences of the decision module.
  unknown_accept_reward_scale: 0.75 # per-flow: downscales only the positive (benign) reward earned by accepting an unknown cluster (action 0, or a non-blocking CTI buy). Negative (malicious) per-flow rewards on an accept are always taken at full value -- a wrong accept is never discounted. Known-class accepts and all block rewards are always unscaled.
  unknown_malicious_accept_penalty_scale: 1.25 # per-flow: upscales (>1.0) the negative (malicious) reward incurred by wrongly accepting an unknown cluster (action 0, or a non-blocking CTI buy). 1.0 is a no-op (full value, the previous behavior). Does not affect benign-accept reward, block rewards, or known-class accepts, which are always unscaled.
  # --- Supervision-value reward components (HIDDEN BY DEFAULT). Two optional,
  # additive reward terms that credit a label-buying (supervised) policy for the
  # perception-quality gains its CTI purchases produce, rather than penalising an
  # unsupervised baseline with hand-tuned costs. Both default to 0.0, which fully
  # hides them: no reward contribution and no wandb series emitted, so an
  # unconfigured run is a strict no-op and reproduces existing results.
  cluster_impurity_penalty_weight: 0.0 # >0 enables it. Per unknown-traffic cluster, subtracts weight * (1 - purity) from that cluster's reward, where purity is the fraction of the cluster's members sharing its majority true label. A policy that has bought more CTI leaves fewer distinct unknown classes bleeding together, so its collective-anomaly clusters are purer and it is penalised less. Tracked in wandb as AGENT/cluster_impurity_penalty and AGENT/mean_cluster_impurity when active.
  classification_accuracy_reward_weight: 0.0 # >0 enables it. Per known-traffic group, adds weight * (that group's closed-set classification accuracy = fraction of its members the IM classified correctly) to its reward. A policy with more Known classes classifies its known traffic more accurately and so earns more. Tracked in wandb as AGENT/classification_accuracy_reward and AGENT/classification_accuracy when active.
  epistemic_is_blocking: false
  no_epistemic_actions: false
  hard_epistemic_action: true # if True, a single epistemic action buys both a G2's label and its "AD oracle" in one shot (same single price): the moment the label is delivered, its samples are flagged Known for free for the rest of the episode, bypassing the IM's neural anomaly-detection verdict, so they always route to the known-traffic (act_on_known) path. Default false keeps the plain behaviour (a label buy grants no oracle).
  dynamic_knowledge: false # if True, every episode reset draws a fresh random Knowns/G1s/G2s partition of the knowledge.Knowns+G1s+G2s class pool, instead of replaying the fixed partition below every episode. Group sizes are preserved (e.g. 3 Knowns / 3 G1s / 7 G2s), only which class falls in which group changes. Default false keeps the fixed curriculum defined under `knowledge:`.
  # --- CTI delivery fidelity (RC 3.4). Models imperfect CTI feeds: purchased
  # intelligence may arrive with degraded label quality, only partial coverage,
  # and/or after a delay, instead of the idealised clean/instant/complete
  # delivery the base game assumes. All knobs default to the clean regime, so an
  # unconfigured run is a strict no-op and reproduces existing results exactly.
  # See smartController/cti_delivery.py (CTIDeliveryModel).
  cti_label_noise: 0.0 # [0,1] fraction of an acquired class's training-label draws relabelled to a wrong class, poisoning its prototype. 0.0 = clean labels (legacy).
  cti_label_noise_mode: 'symmetric' # 'symmetric' (flip to a uniformly-random other Known class) or 'nearest' (flip to the acquired class's nearest-prototype neighbour, a plausible confusion). Only used when cti_label_noise > 0.
  cti_capture_fraction: 1.0 # (0,1] fraction of an acquired class's samples actually admitted into its replay buffer (partial capture). 1.0 = full live tap (legacy); lower = sparser, biased prototype.
  cti_delivery_delay: 0 # decision steps between paying for CTI and the class becoming trainable (G2 -> Known). During the lag it stays an unlearnable, still-costly zero-day. 0 = instant delivery (legacy).
  cti_delivery_jitter: 0 # +/- uniform random jitter (steps) on cti_delivery_delay, for stochastic feed latency. 0 = deterministic delay.
  cti_quality_coupling: 'none' # 'none' | 'purity' | 'confidence'. When set, the label-noise and capture severities scale with (1 - cluster quality) at buy time (true majority-purity, or observed anomaly-confidence): buying CTI for a messy cluster yields worse data than for a clean one. This is the lever that makes selective (RL) buying necessary vs. blind heuristics. Delivery delay is not coupled (it models feed latency).
  boltzmann_sampling: true #  All agents use boltzmann sampling. BUT if agent = DDQN, it has to be specified, otherwise it will use epsilon-greedy.
  update_target_freq: 50 # how many STEPS to wait to update the target model
  use_per: true # Use Prioritized Experience Replay
  n_step_rewards: 3
  per_alpha: 0.6
  per_beta: 0.4
  use_soft_update: true # Use soft update for the target model
  tau: 0.005 # tau for soft update
  #
  # for the DAI Agent:
  #
  use_transition_model: true
  variational_tmodel: false
  epistemic_regularisation_factor: 0.1
  transitionnet_kl_divergence_regularisation_factor: 1.0
  variational_variational_transition_loss: false
  # for the transition model of the DAI agent:
  leakyrelu_alpha: 0.2
  actor_train_interval_steps: 100 # how many STEPS to wait to train the policy net
  entropy_reg_coefficient: 1
  temperature_for_action_sampling: 1.0
  surrogate_policy_consistency: false
  use_critic_to_act: true
  greedy_update: true


