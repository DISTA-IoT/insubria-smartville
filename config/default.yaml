override: ""
# SmartVille Configuration

host_ip: localhost
gns3_web_gui_port: 3080
disable_proxy: false  # Whether to disable the proxy for the nodes of the topology
dashboard_port: 7777 # Port of the Flask dashboard in the host machine
browser_path: firefox
inference_models_path: "./models/default.py"

smart_controller_log_level: info
smart_switch_log_level: info
flow_logger_log_level: info

health_monitoring: true
use_packet_feats: true
node_features: true  # Use health monitoring features to build the feature vectors (requires health monitoring = true)
resample_packets : true # wheter to periocially sample new packets from flows, if false, the first packets of the flow are used continuously

device: cpu # Can be 'cpu' or 'cuda:0', 'cuda:1', etc. Depending on hw availability

synthetic_data: false # for ablation, overwrites real data with gaussian blobs
separability: 1.0 # if using synthetic data, this indicates separability among clusters (1 -> perfectly separable, 0 -> non-separable)

topology_creator:
  # Topology creation configuration
  project: SmartVille

  # Docker images
  controller_docker: pox-controller
  switch_docker: openvswitch
  victim_docker: victim
  attacker_docker: attacker
  monitor_docker: monitor
  mockserver_docker: mockserver
  # STANDALONE IMAGES (OPTIONAL, NOT USED RIGHT NOW)
  zookeeper_docker: confluentinc/cp-zookeeper
  kafka_docker: confluentinc/cp-kafka
  prometheus_docker: prom/prometheus
  grafana_docker: grafana/grafana

  # important ips.
  # PRIVATE SUBNET (INTERNAL NETWORK FOR GNS3 EMULATION)
  subnet: 192.168.1.0
  netmask: /24
  controller_ip: 192.168.1.1 # internal controller port (eth0)
  main_switch_ip: 192.168.1.2
  mockserver_ip: 192.168.1.3
  bridge_ip: 192.168.1.100

  # PUBLIC SUBNET (HOST NETWORK, FOR SMARTVILLE WEBSERVICES)
  controller_hostname: controller # this will be the hostname of the EXTERNAL controller port (eth1)
  monitor_hostname: monitor # this guy will be dynamically assigned an ip on the host network (not the subnet)
  
  ############# ENV VARS:
  monitor:
    SERVER_PORT: 5000

  controller:
    SERVER_PORT: 7777
    ECHO_PORT: 7778
    INTERNAL_IP: ${topology_creator.controller_ip}
  attacker:
    SERVER_PORT: 7777
  
  victim:
    SERVER_PORT: 7777

  mockserver:
    SERVER_PORT: 7777
  ############# EO ENV VARS


  
  # Controller configuration
  contr_start: "../../pox.py samples.pretty_log smartController.tiger_server" # could also be "sh"
  monitor_start: "python monitor_server.py"
  victim_start: "python honeypot_server.py"
  attacker_start: "python attacker_server.py"
  mockserver_start: "python app.py"
  attach_controller_command: "ovs-vsctl set-controller br0 tcp:${topology_creator.controller_ip}:6633 & sh"
  # GNS3 Configuration
  use_gns3_config_file: true
  gns3_config_path: ~/.config/GNS3/2.2/gns3_server.conf

  # GNS3 Server settings (used when use_gns3_config_file is false)
  gns3_host: localhost
  gns3_port: 3080
  gns3_auth: false
  gns3_username: admin
  gns3_password: admin

    
  # Additional Environment variables for all nodes (VAR=VALUE newline separated)
  ADDITIONAL_ENV_VARS: |
    FOO=bar
    BAR=foo


  ###################################################################################################################
  ####### STANDALONE MONITORING NODES
  # these configuration variables are applied only when 
  # the monitoring nodes are standalone ones:

  # These are used only if the monitorning nodes are standalone ones:
  zookeeper_ip: ${topology_creator.monitor_hostname}
  kafka_ip: ${topology_creator.monitor_hostname}
  grafana_ip: ${topology_creator.monitor_hostname}
  prometheus_ip: ${topology_creator.monitor_hostname}

  grafana_start: "run.sh"
  zookeeper_start: "/etc/confluent/docker/run"
  kafka_start: "/etc/confluent/docker/run"
  prometheus_start: "/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.console.libraries=/usr/share/prometheus/console_libraries --web.console.templates=/usr/share/prometheus/consoles"

  zookeeper:
    ZOOKEEPER_SERVER_ID: 1
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000

  kafka:
    KAFKA_BROKER_ID: 1  # Unique identifier for this Kafka broker
    KAFKA_ZOOKEEPER_CONNECT: ${topology_creator.zookeeper_ip}:2181  # Address to connect to Zookeeper
    KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:19092  # Listeners for internal and external communication
    KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092  # Ports to bind Kafka to for listening
    KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE  # Listener for internal Kafka broker communication
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT  # Security protocol mappings for each listener
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # Replication factor for internal Kafka topics
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'  # Automatically create topics when required
    KAFKA_PROCESS_ROLES: 'broker,controller'
    CLUSTER_ID: '1'

  grafana:
   BAR: 'foo'

  prometheus:
   BAR: 'foo'
  ####### END OF STANDALONE MONITORING NODES
  ###################################################################################################################




wandb:
  wb_tracking: false #  Track this run with WeightsAndBiases. (default is False)
  wb_project_name:  'SmartVille' # if 'wb_tracking'=True, The name of the W&B project to associate the run with. Default is 'SmartVille'
  wb_run_name: 'My_new_run' # if 'wb_tracking'=True, the name of the W&B run to track training metrics.
  wb_group_name: 'default'
  entity: jfcevallos
  plots: false
  resource_monitor_interval_secs: 12 # for wholistic system resource monitoring


health:
  max_conn_retries: 5 #(int, optional): max. num. of connections attempts to the kafka broker. Default is 5.
  poll_timeout_seconds: 3 # consumer poll timeout in seconds.
  max_failed_polls: 40 # max. num. of failed poll attempts after which the consuming task is aborted for each topic
  topic_replication_factor: 1
  ping_host: 'www.google.com'
  ping_thread_timeout: 5
  probe_frequency_seconds: 3
  node_features_time_window: 10
  rtt_profiling_num_requests: 20
  rtt_profiling_interval_ms: 100
  probe_metrics:
    - CPU
    # - RAM
    - external_http_rtt
    # - icmp_min_rtt_ms
    # - icmp_max_rtt_ms
    - icmp_avg_rtt_ms
    - icmp_loss_percent
    # - http_min_rtt_ms
    # - http_max_rtt_ms
    - http_avg_rtt_ms
    - http_loss_percent
    - inbound_MBps
    - outbound_MBps
    - inbound_packets_per_second
    - outbound_packets_per_second



neural_modules:
  first_stream_input_size: ${intrusion_detection.flow_feat_dim}
  second_stream_input_size: ${intrusion_detection.packet_feat_dim}
  third_stream_input_size: ${len:${health.probe_metrics}}
  hidden_size: 200
  kernel_regressor_heads: 2
  dropout: 0.2 # Dropout rate for the neural network.
  use_encoder: false
  recurrent_layers: 1
  frozen_decoder: false
  custom_inference_model_path: false
  custom_classifier_path: emptystring
  custom_confidence_decoder_path: emptystring

switching_args:
  flow_idle_timeout:  10 # Number of no-activity seconds for a flow that triggers the switch to delete the corresponding entry in the flow table. 
  arp_timeout: 900 # Number of seconds to delete and ARP entry in the switch. 
  max_buffered_packets: 5  # Max num. of packets the switch buffers while waiting to solve the dest MAC address and forward. . 
  max_buffering_secs: 5  # Max time in seconds the switch buffers a packet while waiting to solve the dest MAC address and forward. 
  arp_req_exp_secs: 4 #  Max time in secs. that the switch waits for an ARP response before issuing another requets. (prevents ARP flooding). 
  sampling_rate_seconds: 15 # (if resample_pakets = True) Time between two consecutive sampling rule installation.
  sampling_flow_hard_timeout: 1 # (if resample_pakets = True) Sampling rules will be hard timed out after this period in seconds.

intrusion_detection:
  eval: false  # Whether to use neural modules in evaluation mode (no training)  
  learning_rate: 1e-3
  use_huber_cs: true # Use Huber loss for the classification loss.
  pretrained_models_dir: '/pox/pox/smartController/tiger_models/'  # This path refers to a path inside the controller docker container
  save_models: false # overwritte models on disk.
  data_collection_mode: false  # If true, TigerBrain records every fully-labelled batch it sees to disk (see FlowDataRecorder) for later offline replay.
  data_collection_dir: '/pox/pox/smartController/tiger_data_collection/'  # Path inside the controller docker container where recorded shards are written.
  data_collection_shard_size: 2000  # Number of samples buffered in memory before a shard is flushed to disk.
  data_collection_flush_interval_secs: 30  # Max seconds a partial shard can sit in memory before being flushed, even if shard_size hasn't been reached.
  data_collection_use_packet_feats: false  # Whether to additionally persist packet_features in each shard (raises disk usage).
  data_collection_use_node_feats: false  # Whether to additionally persist node_features in each shard.
  data_collection_skip_training: true  # If true, process_input returns right after recording -- no IM/DM compute, pure capture run.
  seed: 777  # A fixed initial seed for random sampling and storing in the experience buffer
  agent: DAI_P  # can be DQN, DDQN or DAI
  packets_per_sample: 1 # If 'use_packet_feats'=True, indicates how many packets are appended from each flow to build feature vectors
  max_packet_samples_per_flow_per_tick: 32 # Caps how many packet-feature samples a single flow can contribute to one inference/training tick; excess backlog drains over subsequent ticks instead of blowing up the batch size.
  packet_feat_dim: 64
  anonymize_transport_ports: true
  flow_feat_dim: 4
  flows_per_sample: 10  # Indicates the flowstats time-window size to build feature vectors
  curriculum: 1 # labelling scheme for known attacks, train ZdAs and test ZdAs. (can be 0,1, or 2). Default is 1. 
  flowstats_freq_secs:  5 # Num. of seconds between two consecutive flowstats request from this controller to its assigned switch. MUST BE GRATER THAN 1 SEC.
  k_shot: 4 #  Number of support samples per class (k value for k_shot learning).
  batch_size: 16 # Batch size for the neural network.
  kernel_regression: True
  report_step_freq: 5 # Step Frequency of reporting the training step. 
  plot_step_freq: 150 # Step Frequency of plotting hidden states, score vectors and conf matrices.
  online_eval_step_freq: 100 # Step Frequency of online evaluation.
  use_neural_AD: True
  use_neural_KR: True
  use_neural_CS: True
  online_evaluation: false
  online_evaluation_rounds: 10
  pretrained_inference: True
  greedy_cti: False
  cti_period: -1
  confidence_strategy: 'energy' # can be 'energy', 'entropy', 'margin' or 'baseline' which corresponds to MSP, used by the results in the tiger paper
  max_budget: 300
  min_budget: -60
  max_episode_steps: 750
  multi_class: true  # A boolean flag indicating if the ML classifier should perform multi-class classification
  tiger_init_budget: 1
  cti_price_factor: 4
  price_decay: false
  replay_batch_size: 32
  replay_buffer_max_capacity: 10000
  agent_memory_size: 2000
  repulsive_weight: 1
  attractive_weight: 1
  clustering_loss_backprop: True
  init_epsilon_egreedy: 1.0
  greedy_min: 0.01
  greedy_decay: 0.999
  agent_discount_rate: 0.99
  agency: true # activates the management agent, false to only pretrain the inference modules.
  wrong_inference_penalisation: hard # can be easy or hard
  bad_classif_cost_factor: 40
  bad_clustering_cost_factor: 8
  no_confidence_penalty: 0 # this is a penalty (abs value) given each time the management module discards the closed-set inferences of the decision module.
  automatic_cs_acceptance: false # if True, the management module automatically accepts the closed-set inferences of the decision module.
  useless_epistemic_penalty: 7 # Cost of taking a useless epistemic action
  epistemic_is_blocking: false
  no_epistemic_actions: false
  boltzmann_sampling: true #  All agents use boltzmann sampling. BUT if agent = DDQN, it has to be specified, otherwise it will use epsilon-greedy.
  update_target_freq: 50 # how many STEPS to wait to update the target model
  use_per: true # Use Prioritized Experience Replay
  n_step_rewards: 3
  per_alpha: 0.6
  per_beta: 0.4
  use_soft_update: true # Use soft update for the target model
  tau: 0.005 # tau for soft update
  #
  # for the DAI Agent:
  #
  use_transition_model: true
  variational_tmodel: false
  epistemic_regularisation_factor: 0.1
  transitionnet_kl_divergence_regularisation_factor: 1.0
  variational_variational_transition_loss: false
  # for the transition model of the DAI agent:
  leakyrelu_alpha: 0.2
  actor_train_interval_steps: 100 # how many STEPS to wait to train the policy net
  entropy_reg_coefficient: 1
  temperature_for_action_sampling: 1.0
  surrogate_policy_consistency: false
  use_critic_to_act: true
  greedy_update: true
  uncertainty_blocking_penalty: 1.5


