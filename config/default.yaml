prometheus:
    clientport: 8001 # 8000 is used by the SmartSwitch server in the controller...(you cant change this from here...)
    clienthost: ${topology_creator.controller_hostname}
    serverhost: ${topology_creator.monitor_hostname}
    serverport: 9090
    config_file:
        global:
            scrape_interval:     5s 
            evaluation_interval: 5s 
            external_labels:
                monitor: 'example'

        alerting:
            alertmanagers:
            - static_configs:
                - targets: ['${prometheus.serverhost}:9093']

        rule_files:

        scrape_configs:
            - job_name: 'prometheus'
              scrape_interval: 5s
              scrape_timeout: 5s
              static_configs:
                - targets: ['${prometheus.serverhost}:${prometheus.serverport}']

            - job_name: 'system_metrics'
              static_configs:
                - targets: ['${prometheus.clienthost}:${prometheus.clientport}']


grafana:
    # Username and pass for grafana dashboard. if you change the default admin admin, you should
    # also change the user and password in the config file (/usr/share/grafana/conf/defaults.ini, section security...)
    # in the contianer, so maybe it is better to leave it like this :)
    user: 'admin'  
    password: 'admin'
    port: 3000
    host: ${topology_creator.monitor_hostname}
    datasource_url: http://${prometheus.serverhost}:${prometheus.serverport}
    # this is only the datasources config_file, not the grafana config file.... we are not touching the grafana config file...
    config_file:
        apiVersion: 1

        deleteDatasources:
            - name: prometheus
              orgId: 1

        datasources:
          - name: prometheus
            type: prometheus
            access: proxy
            orgId: 1
            uid: my_unique_uid
            url: ${grafana.datasource_url}
            # user:
            # database:
            # basicAuth:
            # basicAuthUser:
            # withCredentials:
            # isDefault:
            jsonData:
                graphiteVersion: '1.1'
                tlsAuth: false
                tlsAuthWithCACert: false
            secureJsonData:
                tlsCACert: '...'
                tlsClientCert: '...'
                tlsClientKey: '...'
                # password:
                # basicAuthPassword:
            version: 1
            editable: true


zookeeper:
    clientport: 2181
    config_file:
        dataDir: /tmp/zookeeper
        # the port at which the clients will connect
        clientPort: ${zookeeper.clientport}
        # disable the per-ip limit on the number of connections since this is a non-production config
        maxClientCnxns: 0
        # Disable the adminserver by default to avoid port conflicts.
        # Set the port to something non-conflicting if choosing to enable this
        admin:
            enableServer: false
            serverPort: 8080


kafka:
    host: ${topology_creator.monitor_hostname}
    port: 9092
    endpoint: ${kafka.host}:${kafka.port}
    config_file:
        broker.id: 0
        listeners: PLAINTEXT://${kafka.host}:${kafka.port}
        #advertised.listeners: PLAINTEXT://your.host.name:9092
        #listener.security.protocol.map: PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
        num.network.threads: 3
        num.io.threads: 8
        socket.send.buffer.bytes: 102400
        socket.receive.buffer.bytes: 102400
        socket.request.max.bytes: 104857600
        log.dirs: /tmp/kafka-logs
        num.partitions: 1
        num.recovery.threads.per.data.dir: 1
        offsets.topic.replication.factor: 1
        transaction.state.log.replication.factor: 1
        transaction.state.log.min.isr: 1
        #log.flush.interval.messages: 10000
        #log.flush.interval.ms: 1000
        log.retention.hours: 168
        log.retention.check.interval.ms: 300000
        zookeeper.connect: ${topology_creator.monitor_hostname}:${zookeeper.clientport}  # change accordingly to zookeeper's port!
        zookeeper.connection.timeout.ms: 18000
        group.initial.rebalance.delay.ms: 0

