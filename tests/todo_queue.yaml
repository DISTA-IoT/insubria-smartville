# Queue of DQN-family x epistemic-action-ablation experiments to run.
#
# tests/run_todo_queue.py runs these top-to-bottom, one at a time, and
# stops (loudly) on the first failure. After a crash or a finished batch,
# check W&B for which runs actually completed, delete those rows from
# this file, then re-run run_todo_queue.py -- it will pick up exactly
# where the trimmed list says to resume, nothing is tracked elsewhere.
#
# Rows are pre-ordered seed-major (every agent x mode config for seed 1,
# then all of seed 2, then all of seed 3) so that whatever prefix of the
# queue has run so far gives complete coverage of as many whole seeds
# as possible.
#
# Two kinds of row are supported and may be freely interleaved:
#
# 1) DQN-family epistemic-action ablation rows (the ones below):
#      {agent, mode, seed [, cti_period, cti_confidence_threshold]}
#    mode is one of: baseline, no_epistemic, periodic_cti, greedy_cti, fixed_threshold
#      (see tests/seeded_agents.py module docstring for what each one sets).
#    cti_period only matters for mode: periodic_cti; omit it elsewhere or to
#    use the top-level cti_period default below.
#    cti_confidence_threshold only matters for mode: fixed_threshold; omit it
#    elsewhere or to use the top-level cti_confidence_threshold default below.
#
# 2) Inference-model "oracle" ablation rows (the queue-able form of
#    tests/ablating_inference_models.py):
#      {inference, seed [, agent]}
#    inference is one of: perfect, only_AD, only_CS, only_KR, not_AD, not_CS,
#      not_KR (see tests/inference_ablations.py for the use_neural_{AD,CS,KR}
#      flags and W&B run name each one maps to). These ablate the neural
#      inference stack, not the decision agent, so `agent` is optional and
#      defaults to the profile's agent; when given it is set and verified.
#    These default to W&B group "oracle" (not the top-level wandb_group_name).
#
# Any row may add `wandb_group_name: <name>` to override the group for that
# single run.

profile: dista_tiger
wandb_group_name: ORACLE
run_duration_seconds: 2400
health_poll_interval_seconds: 120
cti_period: 10
cti_confidence_threshold: 4

queue:

