<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='/js/dash.js') }}"></script>
    
    <title>SmartVille</title>
</head>
<body>
    <div class="main-container">
        
        <div class="sidebar">
            <h1>SmartVille</h1>
            <div class="containerForGroup">
                <h2>Network Manager</h2>
                <nav>
                    <button id="refresh-containers" class="lightblue small">Refresh containers</button>
                </nav>
                <nav>
                    <button id="create-topology">Create topology</button>
                    <button id="delete-project" class="stop">Delete GNS3 Project</button>
                </nav>
            </div>
            <div class="containerForGroup">
            <h2>Controller Manager</h2>
                <nav>
                    <button id="attach-controller" class="lightblue small">Attach Controller</button>
                </nav>
                <nav>
                    <button id="init-controller" class="blue">Initialize Controller</button>
                    <button id="stop-controller" class="stop">Stop Controller</button>
                </nav>
            </div>
            <div class="containerForGroup">
            <h2>Monitoring Services</h2>
            <nav>
                    <button id="start-services" >Start MS</button>
                    <button id="stop-services" class="stop">Stop MS</button>
                </nav>
                <nav>
                    <button id="start-zookeeper" class="small" >Start Zookeeper</button>
                    <button id="stop-zookeeper" class="stop small">Stop Zookeeper</button>
                </nav>
                <nav>
                    <button id="start-kafka" class="small">Start Kafka</button>
                    <button id="stop-kafka" class="stop small">Stop Kafka</button>
                </nav>
                <nav>
                    <button id="start-prometheus" class="small">Start Prometheus</button>
                    <button id="stop-prometheus" class="stop small">Stop Prometheus</button>
                </nav>
                <nav>
                    <button id="start-grafana" class="small">Start Grafana</button>
                    <button id="stop-grafana" class="stop small">Stop Grafana</button>
                    <button id="open-grafana" class="disabled small" onclick="window.open('http://{{ rendering_params.host_ip }}:{{ rendering_params.grafana_web_gui_port }}', '_blank')" disabled="true">Open Grafana</button>
                </nav>
            </div>
            <div class="containerForGroup">
                <h2>Bot Master</h2>
            <nav>
                    <button id="start-traffic">Start Traffic</button>
                    <button id="check-traffic" class="blue">Check Traffic</button>
                    <button id="stop-traffic" class="stop">Stop Traffic</button>
                </nav>
                <nav>
                    {% for button in rendering_params.traffic_buttons %}
                    <nav>
                        <button id="{{ button }}_start_traffic" class="small">replay from {{ button }}</button>
                        <button id="{{ button }}_stop_traffic" class="stop small">stop replau from {{ button }}</button>
                    </nav>
                {% endfor %}
                </nav>
            </div>
        </div>
        <div class="content">
            <div class="tabs">
                <button class="tablink active" onclick="openTab(event, 'gns3')">GNS3</button>
                <button class="tablink" onclick="openTab(event, 'grafana')">Grafana</button>
            </div>
            <div id="gns3" class="tabcontent" style="display:block;">
                <iframe src="http://{{ rendering_params.host_ip }}:{{ rendering_params.gns3_web_gui_port }}"></iframe>
            </div>
            
            <div id="grafana" class="tabcontent">
                <iframe src="https://wandb.ai/jfcevallos/TIGER/reports/AGENT_budget-24-11-13-14-28-08---VmlldzoxMDE1NDE4Mw"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
